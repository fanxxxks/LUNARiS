<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUNARIS · 高性能启动器</title><style>body{margin:12vh auto;padding:24px;max-width:680px;background:#101315;color:#e9e7df;font:18px/1.8 system-ui}a{color:#b9ded8}h1{font-size:32px}small{color:#abaeaa}</style><h1>LUNARIS 高性能启动器</h1><p>网页版支持三维演示、手动搬运和本地规则调度；此启动器改善浏览器启动方式，不会增加云端智能调度功能。</p><p>Windows 用户下载后双击，在独立的 Edge 或 Chrome 窗口中打开在线仿真，并请求使用高性能显卡。无需安装 Node.js，也不需要模型密钥。</p><p><a href="../downloads/launch-lunaris.cmd" download="启动高性能仿真.cmd">下载「启动高性能仿真.cmd」</a></p><p>需要联网并安装 Edge 或 Chrome。实际帧率取决于电脑显卡、浏览器和系统设置；首次打开需要加载仿真资源。</p><p><small>浏览器可能提示确认下载脚本文件。仅在确认来源为本站时保留和运行。</small></p><p><a href="../">直接在浏览器中进入仿真 →</a></p></html>
